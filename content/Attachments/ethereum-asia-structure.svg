<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The structure forming across five Asian markets</title>
  <desc id="d">Three stacked layers. At the core, central bank ledgers settle. Below them, tokenised deposits and licensed stablecoins act as bridges. At the bottom, public chains distribute regulated assets with whitelists and issuer freeze and correction powers. To the right, beyond a gate of travel rules, wallet checks and whitelists, sit self-custody and open DeFi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="820" height="450" fill="#FFFFFF"/>

  <!-- Core -->
  <rect x="20" y="20" width="540" height="104" rx="8" fill="#E8DCC4"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1F1F1F">Settlement core: central bank ledgers</text>
  <g font-size="12.5" fill="#2B2B2B">
    <text x="40" y="74">Wholesale e-rupee (India), SGD wholesale CBDC (Singapore)</text>
    <text x="40" y="94">EnsembleTX (Hong Kong), Project Hangang (South Korea)</text>
    <text x="40" y="114" fill="#6B6B6B">Japan: no wholesale settlement asset</text>
  </g>

  <line x1="290" y1="126" x2="290" y2="152" stroke="#555555" stroke-width="1.5" marker-start="url(#arrow)"/>
  <text x="302" y="144" font-size="11.5" fill="#555555">settle in central bank money</text>

  <!-- Bridges -->
  <rect x="20" y="156" width="540" height="96" rx="8" fill="#F3ECDD" stroke="#D9C9A6"/>
  <text x="40" y="184" font-size="15" font-weight="700" fill="#1F1F1F">Bridges: tokenised deposits and licensed stablecoins</text>
  <g font-size="12.5" fill="#2B2B2B">
    <text x="40" y="210">Tokenised deposits: DCJPY, Partior, BLOOM, DBS, HSBC, OCBC</text>
    <text x="40" y="230">Licensed stablecoins: HKDAP, JPYC</text>
  </g>

  <line x1="290" y1="254" x2="290" y2="282" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="273" font-size="11.5" fill="#555555">issued onto</text>

  <!-- Distribution -->
  <rect x="20" y="286" width="540" height="112" rx="8" fill="#D6EBE5" stroke="#2E7D6B"/>
  <text x="40" y="314" font-size="15" font-weight="700" fill="#1F1F1F">Distribution: public chains, with controls in the token</text>
  <g font-size="12.5" fill="#2B2B2B">
    <text x="40" y="340">Ethereum mainnet and layer 2s</text>
    <text x="40" y="360">Holder whitelist, issuer freeze, issuer correction</text>
    <text x="40" y="380">Legal register often kept offchain</text>
  </g>

  <!-- Gate -->
  <line x1="562" y1="342" x2="636" y2="342" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="592" y="300" width="8" height="84" fill="#B5473A"/>
  <text x="596" y="414" font-size="11.5" fill="#B5473A" text-anchor="middle">Gate: travel rule,</text>
  <text x="596" y="429" font-size="11.5" fill="#B5473A" text-anchor="middle">wallet checks, whitelists</text>

  <!-- Outside -->
  <rect x="640" y="286" width="160" height="112" rx="8" fill="#FFFFFF" stroke="#9E9E9E" stroke-dasharray="5 4"/>
  <text x="720" y="322" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="middle">Self-custody</text>
  <text x="720" y="340" font-size="14" font-weight="700" fill="#1F1F1F" text-anchor="middle">and open DeFi</text>
  <text x="720" y="366" font-size="12" fill="#555555" text-anchor="middle">Ether, self-hosted</text>
  <text x="720" y="382" font-size="12" fill="#555555" text-anchor="middle">wallets, DeFi pools</text>

  <!-- Cross-border note -->
  <rect x="600" y="20" width="200" height="232" rx="8" fill="#FFFFFF" stroke="#D0D0D0"/>
  <text x="616" y="46" font-size="13" font-weight="700" fill="#1F1F1F">Still open: links</text>
  <text x="616" y="64" font-size="13" font-weight="700" fill="#1F1F1F">between markets</text>
  <g font-size="12" fill="#2B2B2B">
    <text x="616" y="92">Singapore's recognition of</text>
    <text x="616" y="108">foreign stablecoins</text>
    <text x="616" y="136">Japan's list of equivalent</text>
    <text x="616" y="152">foreign regimes</text>
    <text x="616" y="180">BLOOM, now with the</text>
    <text x="616" y="196">central banks of Malaysia</text>
    <text x="616" y="212">and Thailand</text>
  </g>
</svg>
